# 어린이 보호구역 과속 카메라 모니터링 프로그램

컴파일러 프로젝트로 진행한 과속 카메라 시뮬레이션 프로그램입니다.

## 기능
* 어린이 보호구역(School Zone) 기준 시속 30km 단속[span_9](start_span)[span_9](end_span)
* 두 센서 간 거리(약 25m)와 통과 시간($T_2 - T_1$)을 바탕으로 차량의 시속 계산[span_10](start_span)[span_10](end_span)[span_11](start_span)[span_11](end_span)
* `matplotlib`을 이용해 기준 속도와 실제 측정 속도를 그래프로 비교 시각화[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span)

## 팀원
* 김민희, 신지수, 사예빈, 곽희원, 최지원[span_14](start_span)[span_14](end_span)
